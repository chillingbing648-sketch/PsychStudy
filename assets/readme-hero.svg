<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>

    <!-- Synaptic Circuit Gradient -->
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Title Gradient Flow -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="35%" stop-color="#C7D2FE" />
      <stop offset="70%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shimmer {
        0% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(129, 140, 248, 0.9)); }
        100% { opacity: 0.85; }
      }
      .circuit-line {
        stroke-dasharray: 8 12;
        animation: dashFlow 12s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 6 10;
        animation: dashFlow 7s linear infinite reverse;
      }
      .node-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .floating-banner {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .title-shimmer {
        animation: shimmer 4s ease-in-out infinite;
      }
      .font-display {
        font-family: 'Fraunces', 'Cinzel', 'Georgia', serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      .font-sans {
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1000" height="340" rx="16" fill="url(#bgGlow)" stroke="#312E81" stroke-width="1.5" />

  <!-- Ambient Light Wells -->
  <circle cx="180" cy="90" r="140" fill="#4338CA" opacity="0.22" filter="url(#softGlow)" class="node-pulse" />
  <circle cx="820" cy="180" r="160" fill="#0D9488" opacity="0.18" filter="url(#softGlow)" class="node-pulse" style="animation-delay: -2s;" />
  <circle cx="500" cy="280" r="120" fill="#7C3AED" opacity="0.15" filter="url(#softGlow)" class="node-pulse" style="animation-delay: -1s;" />

  <!-- Synaptic Neural Constellation Wireframe -->
  <g opacity="0.45">
    <path class="circuit-line" d="M 60 170 Q 220 80 400 130 T 700 110 T 940 170" fill="none" stroke="url(#synapseGrad)" stroke-width="1.6" />
    <path class="circuit-line-fast" d="M 120 260 Q 300 200 500 240 T 880 220" fill="none" stroke="#2DD4BF" stroke-width="1.2" opacity="0.6" />
    <path class="circuit-line" d="M 220 50 L 350 160 L 520 80 L 680 180 L 820 90" fill="none" stroke="#818CF8" stroke-width="0.9" opacity="0.4" />
  </g>

  <!-- Constellation Nodes -->
  <g>
    <circle cx="220" cy="80" r="5" fill="#818CF8" filter="url(#glow)" />
    <circle cx="400" cy="130" r="6" fill="#2DD4BF" filter="url(#glow)" />
    <circle cx="700" cy="110" r="5.5" fill="#C084FC" filter="url(#glow)" />
    <circle cx="880" cy="220" r="4.5" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="300" cy="200" r="4" fill="#F472B6" filter="url(#glow)" />
  </g>

  <!-- Central Brand Content Block -->
  <g class="floating-banner" transform="translate(0, 0)">
    <!-- Eyebrow Badge -->
    <g transform="translate(500, 52)">
      <rect x="-190" y="-14" width="380" height="28" rx="14" fill="rgba(30, 27, 75, 0.75)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <circle cx="-168" cy="0" r="4" fill="#10B981" />
      <text x="-152" y="4" class="font-mono" font-size="11" font-weight="700" fill="#A5B4FC" letter-spacing="0.1em">UNDERGRADUATE PSYCHOLOGY STANDARD</text>
      <text x="130" y="4" class="font-mono" font-size="10" font-weight="600" fill="#34D399" letter-spacing="0.06em">DSM-5-TR</text>
    </g>

    <!-- Main Title Display -->
    <text x="500" y="126" text-anchor="middle" class="font-display title-shimmer" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.02em">
      PSYCHSTUDY
    </text>

    <!-- Latin Calligraphy Roman Sub-Header -->
    <text x="500" y="162" text-anchor="middle" class="font-display" font-size="19" font-style="italic" font-weight="400" fill="#E0E7FF" opacity="0.92" letter-spacing="0.04em">
      The Clinical Atlas of the Mind
    </text>

    <!-- Mission Subtitle -->
    <text x="500" y="200" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="400" fill="#94A3B8" letter-spacing="0.01em">
      University-grade clinical study companion, multi-axial diagnostic framework, and structured examination workspace.
    </text>

    <!-- Live Platform Feature Badges Row -->
    <g transform="translate(500, 262)">
      <!-- Pill 1: 43 Chapters -->
      <g transform="translate(-345, 0)">
        <rect x="0" y="0" width="158" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-size="14">📖</text>
        <text x="36" y="22" class="font-mono" font-size="11" font-weight="700" fill="#F8FAFC">43 Chapters</text>
        <text x="114" y="22" class="font-mono" font-size="10" fill="#64748B">9 Vols</text>
      </g>

      <!-- Pill 2: 121 Flashcards -->
      <g transform="translate(-172, 0)">
        <rect x="0" y="0" width="166" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-size="14">🗂️</text>
        <text x="36" y="22" class="font-mono" font-size="11" font-weight="700" fill="#F8FAFC">121 Recall Cards</text>
        <text x="135" y="22" class="font-mono" font-size="10" fill="#64748B">SM-2</text>
      </g>

      <!-- Pill 3: Constellation Map -->
      <g transform="translate(8, 0)">
        <rect x="0" y="0" width="168" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-size="14">🌌</text>
        <text x="36" y="22" class="font-mono" font-size="11" font-weight="700" fill="#F8FAFC">Concept Map</text>
        <text x="120" y="22" class="font-mono" font-size="10" fill="#64748B">39 Links</text>
      </g>

      <!-- Pill 4: Pure Vanilla Offline -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="158" height="36" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" font-size="14">⚡</text>
        <text x="36" y="22" class="font-mono" font-size="11" font-weight="700" fill="#F8FAFC">100% Offline</text>
        <text x="114" y="22" class="font-mono" font-size="10" fill="#10B981">Zero-Dep</text>
      </g>
    </g>
  </g>
</svg>
