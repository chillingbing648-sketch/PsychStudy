<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 140" fill="none" class="ill-mountain-svg">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="mountFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="mountBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
  </defs>

  <!-- Glowing Sun / Achievement Ring -->
  <circle cx="110" cy="45" r="24" fill="url(#sunGrad)" opacity="0.85"/>
  <circle cx="110" cy="45" r="32" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Back Mountain Peak -->
  <polygon points="75,45 135,135 15,135" fill="url(#mountBack)" opacity="0.6"/>
  <!-- Snow/Luminance Cap Back -->
  <polygon points="75,45 87,65 72,62 65,68" fill="#FFF7ED" opacity="0.8"/>

  <!-- Front Mountain Peak -->
  <polygon points="120,55 175,135 65,135" fill="url(#mountFront)" opacity="0.85"/>
  <!-- Snow/Luminance Cap Front -->
  <polygon points="120,55 132,74 118,70 110,76" fill="#FFF7ED" opacity="0.95"/>

  <!-- Path / Ascent Trail -->
  <path d="M70 135 Q 95 110 120 85" stroke="#FFF7ED" stroke-width="2" stroke-dasharray="3 3" opacity="0.7"/>

  <!-- Flag at summit -->
  <line x1="120" y1="55" x2="120" y2="40" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
  <polygon points="120,40 132,45 120,50" fill="#EA580C"/>

  <!-- Sparkles -->
  <circle cx="45" cy="50" r="2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="155" cy="35" r="2.5" fill="#FBBF24" opacity="0.9"/>
</svg>
