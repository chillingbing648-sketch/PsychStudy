name: CI & GitHub Pages Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Validate Code & Data Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify JavaScript Syntax
        run: node -c script.js

      - name: Validate Clinical Data Integrity
        run: node tools/validate-data.mjs

  deploy-sync:
    name: Sync to gh-pages & Trigger Live Deployment
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout gh-pages
          git merge main --ff-only
          git push origin gh-pages
